<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    @font-face {
      font-family: "Hanken Grotesk";
      src: url("{{ '/assets/fonts/hanken-grotesk-var.woff2' | relative_url }}") format("woff2");
      font-weight: 400 700; font-style: normal; font-display: swap;
    }

    :root {
      --paper:   oklch(0.986 0.006 78);
      --surface: oklch(0.963 0.008 78);
      --ink:     oklch(0.305 0.012 62);
      --muted:   oklch(0.520 0.012 62);
      --faint:   oklch(0.630 0.010 68);
      --hair:    oklch(0.905 0.008 74);
      --hair-2:  oklch(0.855 0.010 74);
      --accent:  oklch(0.520 0.118 46);
      --accent-2:oklch(0.452 0.126 44);
      --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --shell: 82rem;   /* outer width */
      --read: 44rem;    /* prose measure */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:   oklch(0.206 0.009 66);
        --surface: oklch(0.252 0.010 66);
        --ink:     oklch(0.902 0.008 82);
        --muted:   oklch(0.685 0.012 78);
        --faint:   oklch(0.560 0.012 74);
        --hair:    oklch(0.330 0.011 70);
        --hair-2:  oklch(0.400 0.012 70);
        --accent:  oklch(0.735 0.108 54);
        --accent-2:oklch(0.800 0.098 58);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--sans); font-size: 1.0625rem; line-height: 1.72;
      font-weight: 400; letter-spacing: -0.003em;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    main { animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }

    /* ---- masthead ---- */
    .masthead {
      position: sticky; top: 0; z-index: 20;
      background: var(--paper); border-bottom: 1px solid var(--hair);
    }
    .masthead-in {
      max-width: var(--shell); margin: 0 auto;
      padding: 1.05rem 2rem; display: flex; align-items: baseline;
      justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .brand { font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
    .brand span { color: var(--faint); font-weight: 500; }
    .masthead-in nav { display: flex; gap: 1.4rem; font-size: 0.9rem; }
    .masthead-in nav a { color: var(--muted); }
    .masthead-in nav a:hover { color: var(--accent); }

    /* ---- two-column shell ---- */
    .shell {
      max-width: var(--shell); margin: 0 auto;
      padding: 3.25rem 2rem 5rem;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 3.5rem;
    }
    @media (min-width: 1080px) {
      .shell { grid-template-columns: 15rem minmax(0, 1fr); }
    }

    /* ---- table of contents ---- */
    .toc { display: none; }
    @media (min-width: 1080px) {
      .toc {
        display: block; position: sticky; top: 5.2rem; align-self: start;
        font-size: 0.9rem; line-height: 1.5; max-height: calc(100vh - 7rem); overflow-y: auto;
      }
    }
    .toc-label {
      text-transform: uppercase; letter-spacing: 0.09em; font-size: 0.72rem;
      font-weight: 600; color: var(--faint); margin-bottom: 0.85rem;
    }
    .toc ol { list-style: none; margin: 0; padding: 0; }
    .toc li { margin: 0.1rem 0; }
    .toc a {
      display: block; padding: 0.28rem 0 0.28rem 0.85rem; color: var(--muted);
      text-decoration: none; border-left: 1px solid var(--hair);
    }
    .toc a:hover { color: var(--ink); border-left-color: var(--hair-2); }
    .toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }

    /* ---- article ---- */
    article { min-width: 0; }
    article > * { max-width: var(--read); }
    article > pre, article > table, article > .mermaid,
    article > p:has(> img), article > blockquote { max-width: 100%; }

    a { color: var(--accent); text-decoration: underline;
        text-decoration-thickness: 1px; text-underline-offset: 0.16em;
        text-decoration-color: color-mix(in oklab, var(--accent) 42%, transparent); }
    a:hover { color: var(--accent-2); text-decoration-color: currentColor; }

    h1, h2, h3, h4 { line-height: 1.16; letter-spacing: -0.02em; font-weight: 700; }
    h1 { font-size: clamp(2rem, 1.4rem + 2.4vw, 3rem); margin: 0.1rem 0 0.7rem; }
    h2 { font-size: clamp(1.45rem, 1.28rem + 0.8vw, 1.8rem); font-weight: 650;
         margin: 3.1rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--hair);
         scroll-margin-top: 5.5rem; }
    h3 { font-size: 1.22rem; font-weight: 600; margin: 2.1rem 0 0.6rem; scroll-margin-top: 5.5rem; }
    h4 { font-size: 1.02rem; font-weight: 600; margin: 1.6rem 0 0.4rem; color: var(--muted); }
    p, ul, ol { margin: 0 0 1.15rem; }
    li { margin: 0.3rem 0; }
    strong { font-weight: 600; }

    h1 + p { font-size: 1.2rem; line-height: 1.58; color: var(--muted); font-weight: 400;
             margin-bottom: 1.6rem; }
    p > em:only-child {
      display: block; font-style: normal; font-size: 0.86rem;
      color: var(--faint); line-height: 1.5; margin-top: -0.6rem;
    }

    code {
      font-family: var(--mono); font-size: 0.86em;
      background: var(--surface); padding: 0.1em 0.36em; border-radius: 5px;
      border: 1px solid var(--hair);
    }
    pre {
      background: var(--surface); color: var(--ink);
      padding: 1.05rem 1.2rem; border-radius: 10px; border: 1px solid var(--hair);
      overflow-x: auto; font-size: 0.84rem; line-height: 1.62; margin: 1.3rem 0;
    }
    pre code { background: none; border: none; padding: 0; font-size: inherit; }

    blockquote {
      margin: 1.5rem 0; padding: 1rem 1.25rem; border-radius: 10px;
      background: var(--surface); color: var(--muted);
      font-size: 0.97rem; border: 1px solid var(--hair);
    }
    blockquote p:last-child { margin-bottom: 0; }

    img { max-width: 100%; height: auto; display: block;
          border: 1px solid var(--hair-2); border-radius: 10px; margin: 1.5rem 0 0.5rem; }

    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0;
            font-size: 0.94rem; display: block; overflow-x: auto; }
    th, td { text-align: left; padding: 0.62rem 0.9rem 0.62rem 0;
             border-bottom: 1px solid var(--hair); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--hair-2);
         white-space: nowrap; }
    td:not(:last-child), th:not(:last-child) { padding-right: 1.7rem; }

    hr { border: 0; border-top: 1px solid var(--hair); margin: 2.8rem 0; max-width: 100%; }

    .mermaid { margin: 1.9rem 0; text-align: center; }
    .mermaid svg { max-width: 100%; height: auto; }

    .site-foot {
      max-width: var(--shell); margin: 0 auto; padding: 2rem 2rem 4rem;
      border-top: 1px solid var(--hair); color: var(--faint); font-size: 0.85rem;
    }
    .site-foot a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-in">
      <a class="brand" href="{{ '/' | relative_url }}">Isaac Joumessi <span>/ security research</span></a>
      <nav>
        <a href="{{ '/analysis/xmrig-wordpress-cryptojacking.html' | relative_url }}">Analysis</a>
        <a href="{{ '/analysis/IOCs.html' | relative_url }}">Indicators</a>
        <a href="https://github.com/ZenithGenius/wordpress-xmrig-cryptojacking">Repository</a>
      </nav>
    </div>
  </header>

  <div class="shell">
    <aside class="toc" id="toc" aria-label="On this page"></aside>
    <article>
      {{ content }}
    </article>
  </div>

  <footer class="site-foot">
    Isaac Joumessi. Written up for defensive and educational use.
    Attacker indicators are shared for threat intelligence; the affected party is not identified.
  </footer>

  <script src="{{ '/assets/mermaid.min.js' | relative_url }}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Mermaid: convert fenced blocks to diagrams, themed to the palette.
      document.querySelectorAll("code.language-mermaid, .language-mermaid").forEach(function (el) {
        var host = el.closest(".language-mermaid") || el;
        var div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = el.textContent;
        host.replaceWith(div);
      });
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var light = { primaryColor: "#f1ece3", primaryBorderColor: "#c7b7a6", primaryTextColor: "#3a332e",
                    lineColor: "#a1978c", secondaryColor: "#e9e2d7", tertiaryColor: "#f5f1ea", fontSize: "15px" };
      var night = { primaryColor: "#2f2a25", primaryBorderColor: "#5d5147", primaryTextColor: "#e6ded4",
                    lineColor: "#8b8175", secondaryColor: "#342e28", tertiaryColor: "#292420", fontSize: "15px" };
      var vars = dark ? night : light;
      vars.fontFamily = '"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif';
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base",
                           themeVariables: vars, flowchart: { curve: "basis", padding: 14 } });
      mermaid.run({ querySelector: ".mermaid" });

      // Build the table of contents from section headings.
      var heads = Array.prototype.slice.call(document.querySelectorAll("article h2[id]"));
      var toc = document.getElementById("toc");
      if (toc && heads.length > 2) {
        var label = document.createElement("div");
        label.className = "toc-label"; label.textContent = "On this page";
        var ol = document.createElement("ol");
        heads.forEach(function (h) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "#" + h.id;
          a.textContent = h.textContent.replace(/^\s*\d+[.)]\s*/, "");
          li.appendChild(a); ol.appendChild(li);
        });
        toc.appendChild(label); toc.appendChild(ol);

        // Lightweight scroll-spy.
        var links = {};
        ol.querySelectorAll("a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
        var spy = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              Object.values(links).forEach(function (a) { a.classList.remove("active"); });
              if (links[e.target.id]) links[e.target.id].classList.add("active");
            }
          });
        }, { rootMargin: "-10% 0px -80% 0px" });
        heads.forEach(function (h) { spy.observe(h); });
      }
    });
  </script>
</body>
</html>
